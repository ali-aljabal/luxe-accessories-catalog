<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كتالوج الاكسسوارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a printed jeweller's lookbook, unhurried, framed like prints on linen
   IDEA: each photo sits in a white mount with a gold hairline, like a boutique display card
   PICTURE: a slow moving strip of real products in the hero, then mounted cards
   COLOUR and TYPE: linen #F5EFE6, espresso #3D302B, soft gold #C6A477, white mounts; Amiri display, Plex Arabic text
   LAYOUT: editorial hero, sliding section index, one chapter per folder, featured first card */
:root{color-scheme:light;--linen:#F5EFE6;--white:#FFFFFF;--esp:#3D302B;--esp2:#2a201c;--gold:#C6A477;--gold2:#a8875a;--ink:#3D302B;--mute:#85705f;--line:#e5d8c5}
:root[data-theme]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--linen);color:var(--ink);font:16px/1.65 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.wrap{max-width:1240px;margin:auto;padding-inline:max(4vw,16px)}
.serif{font-family:Amiri,serif}

/* hero */
.hero{background:var(--esp);color:var(--linen);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(198,164,119,.05) 0 1px,transparent 1px 120px);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:22px;border-bottom:1px solid rgba(198,164,119,.25);font-size:13px;color:#cdbca7}
.logo{font:700 20px/1 Amiri,serif;color:var(--gold);letter-spacing:.02em}
.top a{text-decoration:none;border-bottom:1px solid rgba(198,164,119,.5);padding-bottom:2px}
.hero-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,72px);align-items:end;padding-block:clamp(40px,7vw,96px) clamp(28px,4vw,48px)}
.eyebrow{color:var(--gold);font-size:14px;margin:0 0 18px;display:flex;align-items:center;gap:12px}
.eyebrow::after{content:'';width:56px;height:1px;background:var(--gold)}
h1{font:700 clamp(44px,7vw,92px)/1 Amiri,serif;margin:0;letter-spacing:0}
h1 span{display:block;overflow:hidden;padding-bottom:.08em}
h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:rise 1.1s cubic-bezier(.2,.7,.1,1) forwards}
h1 span:nth-child(2) i{animation-delay:.12s;color:var(--gold)}
@keyframes rise{to{transform:none}}
.hero-side p{margin:0 0 26px;color:#d8c9b6;max-width:40ch;opacity:0;animation:fade .9s .5s forwards}
@keyframes fade{to{opacity:1}}
.figs{display:flex;gap:0;border-top:1px solid rgba(198,164,119,.3);opacity:0;animation:fade .9s .7s forwards}
.figs div{flex:1;padding:16px 0 4px;border-inline-start:1px solid rgba(198,164,119,.3);padding-inline-start:16px}
.figs div:first-child{border:0;padding-inline-start:0}
.figs b{display:block;font:700 34px/1 Amiri,serif;color:var(--gold)}
.figs span{font-size:13px;color:#cdbca7}
/* moving strip */
.strip{position:relative;padding-block:0 clamp(28px,4vw,44px);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:14px;width:max-content;animation:slide 70s linear infinite}
.strip:hover .track{animation-play-state:paused}
.track img{width:clamp(120px,14vw,180px);aspect-ratio:3/4;object-fit:cover;border:6px solid #fff;outline:1px solid rgba(198,164,119,.6);outline-offset:-10px;box-shadow:0 14px 30px -14px rgba(0,0,0,.7);background:#4a3a33;color:transparent}
.track img:nth-child(even){margin-top:22px}
@keyframes slide{to{transform:translateX(50%)}}

/* index */
nav.idx{position:sticky;top:0;z-index:5;background:rgba(245,239,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.idx .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:relative}
nav.idx .wrap::-webkit-scrollbar{display:none}
nav.idx a{flex:none;text-decoration:none;padding:20px 14px 18px;font-size:15px;color:var(--mute);white-space:nowrap;transition:color .25s}
nav.idx a small{font-size:12px;color:var(--gold2);margin-inline-start:4px}
nav.idx a.on{color:var(--ink)}
.bar{position:absolute;bottom:0;height:2px;background:var(--gold);transition:left .35s cubic-bezier(.2,.7,.1,1),width .35s cubic-bezier(.2,.7,.1,1)}

/* chapters */
.group-title{display:flex;align-items:center;gap:16px;margin:clamp(44px,6vw,80px) 0 0;color:var(--gold2);font-size:14px}
.group-title::after{content:'';flex:1;height:1px;background:var(--line)}
.chapter{padding-top:28px}
.ch-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--esp)}
.ch-head h2{font:700 clamp(30px,4vw,46px)/1.05 Amiri,serif;margin:0}
.ch-meta{display:flex;gap:18px;align-items:center;font-size:14px;color:var(--mute);white-space:nowrap}
.ch-meta a{color:var(--gold2);text-decoration:none;border-bottom:1px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.card{position:relative;background:var(--white);padding:10px 10px 0;border:0;cursor:zoom-in;text-align:start;font:inherit;color:inherit;
  box-shadow:0 1px 0 var(--line),0 18px 30px -24px rgba(61,48,43,.55);transform:translateY(24px);opacity:0;
  transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.1,1),box-shadow .35s}
.card.in{opacity:1;transform:none}
.card .ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:#efe6d9}
.card .ph::after{content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,.75);pointer-events:none;opacity:0;transition:opacity .35s, inset .35s}
.card img{width:100%;height:100%;object-fit:cover;display:block;color:transparent;transition:transform 1.2s cubic-bezier(.2,.7,.1,1),opacity .5s;opacity:0}
.card img.ok{opacity:1}
.card .cap{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 12px;font-size:12px;color:var(--mute)}
.card .cap b{font-weight:500;color:var(--ink)}
.card .cap .v{color:var(--gold2);opacity:0;transform:translateX(6px);transition:.35s}
.card:hover{box-shadow:0 1px 0 var(--gold),0 26px 40px -24px rgba(61,48,43,.7)}
.card:hover img{transform:scale(1.06)}
.card:hover .ph::after{opacity:1;inset:12px}
.card:hover .cap .v{opacity:1;transform:none}
.card.feat{grid-column:span 2;grid-row:span 2}
.card.feat .ph{aspect-ratio:auto;height:calc(100% - 44px)}
.card.bad .ph::before{content:'تعذر تحميل الصورة';position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--mute)}
.more{display:block;margin:22px auto 0;background:none;border:1px solid var(--esp);color:var(--esp);font:inherit;font-size:15px;padding:12px 28px;cursor:pointer;min-height:44px;transition:background .25s,color .25s}
.more:hover{background:var(--esp);color:var(--linen)}
.empty{border:1px dashed var(--gold);padding:34px;text-align:center;color:var(--mute);background:rgba(255,255,255,.5)}
footer{margin-top:clamp(60px,8vw,110px);background:var(--esp2);color:#cdbca7;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:34px}
footer .logo{font-size:24px}
footer a{color:var(--gold)}
.up{position:fixed;left:18px;bottom:18px;z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:var(--esp);color:var(--gold);font-size:18px;cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:.3s}
.up.show{opacity:1;transform:none;pointer-events:auto}

/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(36,27,23,.985);display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:var(--linen);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.lb.open{opacity:1;visibility:visible}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:16px max(3vw,14px)}
.lb-top span{font:700 22px/1 Amiri,serif;color:var(--gold)}
.lb-top small{color:#cdbca7;margin-inline-start:10px;font:14px "IBM Plex Sans Arabic"}
.stage{display:flex;align-items:center;justify-content:center;padding:0 70px;min-height:0}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border:8px solid #fff;transform:scale(.96);transition:transform .45s cubic-bezier(.2,.7,.1,1),opacity .3s}
.lb.open .stage img{transform:none}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:14px max(3vw,14px) 18px;scrollbar-width:thin}
.thumbs img{flex:none;width:54px;height:70px;object-fit:cover;opacity:.45;cursor:pointer;border:1px solid transparent;transition:.25s;color:transparent}
.thumbs img.on{opacity:1;border-color:var(--gold)}
.ib{background:none;border:1px solid rgba(198,164,119,.6);color:var(--gold);width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:.25s}
.ib:hover{background:var(--gold);color:var(--esp)}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .prev{right:14px}.lb .next{left:14px}
.lb-top .acts{display:flex;gap:10px;align-items:center}
.lb-top .acts a{font-size:13px;color:#cdbca7}

@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
  .hero-body{grid-template-columns:minmax(0,1fr);align-items:start}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ch-head{grid-template-columns:minmax(0,1fr)}
  .stage{padding:0 10px}.lb .nav{top:auto;bottom:96px;transform:none}
  .top .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span i{transform:none}.card{opacity:1;transform:none}.hero-side p,.figs{opacity:1}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="top"><span class="logo">LUXE ACCESSORIES</span><span class="hide-sm">مجوهرات · نظارات · أقلام · أثواب</span></div>
    <div class="hero-body">
      <div>
        <p class="eyebrow">كتالوج المنتجات</p>
        <h1><span><i>اكسسوارات</i></span><span><i>رجالية ونسائية</i></span></h1>
      </div>
      <div class="hero-side">
        <p>تشكيلة مختارة من السلاسل والأساور والخواتم والنظارات والأقلام، مرتبة حسب الأقسام. اضغط على أي قطعة لمشاهدتها بحجم كامل.</p>
        <div class="figs" id="figs"></div>
      </div>
    </div>
  </div>
  <div class="strip" aria-hidden="true"><div class="track" id="track"></div></div>
</header>
<nav class="idx" aria-label="الأقسام"><div class="wrap" id="idx"><span class="bar" id="bar"></span></div></nav>
<main class="wrap" id="main"></main>
<footer><div class="wrap"><span class="logo">LUXE ACCESSORIES</span><span>اكسسوارات رجالية ونسائية</span></div></footer>
<button class="up" id="up" aria-label="للأعلى">↑</button>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="عرض الصورة">
  <div class="lb-top"><div><span id="lbCap"></span><small id="lbNum"></small></div><div class="acts"><button class="ib" id="lbClose" aria-label="إغلاق">✕</button></div></div>
  <div class="stage"><img id="lbImg" alt=""></div>
  <div class="thumbs" id="thumbs"></div>
  <button class="ib nav prev" id="lbPrev" aria-label="السابقة">›</button>
  <button class="ib nav next" id="lbNext" aria-label="التالية">‹</button>
</div>

const PAGE = 21;
const BASE = 'https://pub-7074869cb8604385ac53320ad28c1d88.r2.dev/store/';
const PATHS = {}; DATA.forEach(s=>{ s.files = s.files.map(p=>{ const id=p.split('/').pop(); PATHS[id]=p; return id; }); });
const src = id => `${BASE}${PATHS[id]}.jpg`;
window.__ok = el => el.classList.add('ok');
window.__err = el => {
  const id = el.dataset.id, n = +(el.dataset.try||0); el.dataset.try = n+1;
  const urls = [`${BASE}${PATHS[id]}.jpg?r=1`, `${BASE}${id}.jpg`, `https://lh3.googleusercontent.com/d/${id}=w500`];
  if(n < urls.length){ setTimeout(()=>{ el.src = urls[n]; }, n*800); return; }
  el.onerror = null; el.closest('.card')?.classList.add('bad');
};
const imgTag = (id, extra='') => `<img src="${src(id)}" data-id="${id}" alt="" ${extra} onload="window.__ok(this)" onerror="window.__err(this)">`;

const total = DATA.reduce((a,s)=>a+s.files.length,0);
const withPics = DATA.filter(s=>s.files.length);
document.getElementById('figs').innerHTML =
  `<div><b>${total}</b><span>قطعة مصوّرة</span></div><div><b>${withPics.length}</b><span>قسم</span></div><div><b>${new Set(DATA.map(s=>s.group)).size}</b><span>فئات</span></div>`;

// hero strip: two picks from each section, doubled for a seamless loop
const picks = withPics.flatMap(s=>[s.files[0], s.files[Math.floor(s.files.length/2)]]).filter((v,i,a)=>a.indexOf(v)===i);
document.getElementById('track').innerHTML = [...picks, ...picks].map(id=>imgTag(id,'loading="eager"')).join('');

// index
const idx = document.getElementById('idx');
idx.insertAdjacentHTML('beforeend', DATA.map((s,i)=>`<a href="#c${i}" data-i="${i}">${s.name}<small>${s.files.length}</small></a>`).join(''));

// chapters
const groups = [...new Set(DATA.map(s=>s.group))];
const shown = DATA.map(()=>0);
document.getElementById('main').innerHTML = groups.map(g=>`
  <div class="group-title">${g}</div>
  ${DATA.map((s,i)=>s.group!==g?'':`
  <section class="chapter" id="c${i}">
    <div class="ch-head"><h2>${s.name}</h2>
      <div class="ch-meta"><span>${s.files.length ? s.files.length + ' صورة' : 'لا توجد صور'}</span></div></div>
    ${s.files.length ? `<div class="grid" id="g${i}"></div><button class="more" id="m${i}" hidden></button>` : `<div class="empty">هذا القسم فاضي حالياً.</div>`}
  </section>`).join('')}`).join('');

const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{rootMargin:'0px 0px -6% 0px'}) : null;
function fill(i, n){
  const s = DATA[i], grid = document.getElementById('g'+i); if(!grid) return;
  const start = shown[i], end = Math.min(s.files.length, start + n);
  let html = '';
  for(let k=start; k<end; k++){
    const feat = k===0 && s.files.length>=6 ? ' feat' : '';
    html += `<button class="card${feat}" data-i="${i}" data-k="${k}" aria-label="${s.name} ${k+1}" style="transition-delay:${((k-start)%8)*60}ms"><div class="ph">${imgTag(s.files[k],'loading="lazy"')}</div><div class="cap"><b>${String(k+1).padStart(2,'0')} / ${s.files.length}</b><span class="v">عرض ←</span></div></button>`;
  }
  grid.insertAdjacentHTML('beforeend', html);
  [...grid.querySelectorAll('.card:not(.in)')].forEach(c=> io ? io.observe(c) : c.classList.add('in'));
  shown[i] = end;
  const m = document.getElementById('m'+i);
  m.hidden = end >= s.files.length;
  m.textContent = `عرض المزيد · ${s.files.length - end}`;
}
DATA.forEach((s,i)=>fill(i, PAGE));

document.getElementById('main').addEventListener('click', e=>{
  const more = e.target.closest('.more'); if(more){ fill(+more.id.slice(1), 48); return; }
  const c = e.target.closest('.card'); if(c) openLb(+c.dataset.i, +c.dataset.k);
});

// subtle tilt on pointer devices
if(matchMedia('(hover:hover) and (prefers-reduced-motion:no-preference)').matches){
  document.getElementById('main').addEventListener('pointermove', e=>{
    const c = e.target.closest('.card.in'); if(!c) return;
    const r = c.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
    c.style.transform = `perspective(900px) rotateY(${x*5}deg) rotateX(${-y*5}deg) translateY(-4px)`;
  });
  document.getElementById('main').addEventListener('pointerout', e=>{ const c = e.target.closest('.card'); if(c && !c.contains(e.relatedTarget)) c.style.transform=''; });
}

// sliding index bar + scroll spy
const bar = document.getElementById('bar'), links = [...idx.querySelectorAll('a')];
function mark(i){
  links.forEach(a=>a.classList.toggle('on', +a.dataset.i===i));
  const a = links.find(l=>+l.dataset.i===i); if(!a) return;
  bar.style.left = a.offsetLeft+'px'; bar.style.width = a.offsetWidth+'px';
  const w = idx; if(a.offsetLeft < w.scrollLeft || a.offsetLeft+a.offsetWidth > w.scrollLeft+w.clientWidth) w.scrollTo({left:a.offsetLeft - w.clientWidth/2 + a.offsetWidth/2, behavior:'smooth'});
}
const chapters = [...document.querySelectorAll('.chapter')];
const spy = 'IntersectionObserver' in window ? new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting) mark(+e.target.id.slice(1)); });
},{rootMargin:'-30% 0px -60% 0px'}) : null;
chapters.forEach(c=>spy && spy.observe(c));
mark(0);

const up = document.getElementById('up');
addEventListener('scroll',()=>up.classList.toggle('show',scrollY>900),{passive:true});
up.onclick = ()=>scrollTo({top:0,behavior:'smooth'});

// lightbox
const lb = document.getElementById('lb'), img = document.getElementById('lbImg'), thumbs = document.getElementById('thumbs');
let cur = [0,0];
function openLb(i,k){
  cur=[i,k];
  thumbs.innerHTML = DATA[i].files.map((id,j)=>`<img src="${src(id)}" data-j="${j}" alt="" loading="lazy">`).join('');
  lb.classList.add('open'); document.body.style.overflow='hidden'; show();
}
function show(){
  const [i,k] = cur, s = DATA[i], id = s.files[k];
  img.style.opacity = .2;
  img.onload = ()=>{ img.style.opacity = 1; };
  img.onerror = ()=>{ img.onerror=null; img.src = `https://lh3.googleusercontent.com/d/${id}=w1600`; };
  img.src = src(id);
  document.getElementById('lbCap').textContent = s.name;
  document.getElementById('lbNum').textContent = `${k+1} / ${s.files.length}`;
  thumbs.querySelectorAll('img').forEach(t=>t.classList.toggle('on', +t.dataset.j===k));
  thumbs.querySelector('img.on')?.scrollIntoView({inline:'center',block:'nearest'});
}
function step(d){ const n = DATA[cur[0]].files.length; cur[1] = (cur[1]+d+n)%n; show(); }
function closeLb(){ lb.classList.remove('open'); document.body.style.overflow=''; }
thumbs.addEventListener('click', e=>{ const t=e.target.closest('img'); if(t){ cur[1]=+t.dataset.j; show(); } });
document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbNext').onclick = ()=>step(1);
document.getElementById('lbPrev').onclick = ()=>step(-1);
lb.addEventListener('click', e=>{ if(e.target===lb || e.target.classList.contains('stage')) closeLb(); });
document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') step(1);
  if(e.key==='ArrowRight') step(-1);
});
let sx=null;
lb.addEventListener('touchstart', e=>sx=e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) step(dx>0?1:-1); sx=null; });
}
</script>
</body>
